name: sports-management

services:
  # 数据库服务
  db:
    image: mysql:8.0
    container_name: sports-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sports_db
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sports-network

  # 后端服务
  backend:
    build: ./backend
    container_name: sports-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: sports_db
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong2024
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - sports-network

  # 前端服务
  frontend:
    build: ./frontend
    container_name: sports-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sports-network

volumes:
  mysql_data:
    driver: local

networks:
  sports-network:
    driver: bridge
